        // Function to render questions into the DOM
        function renderizarQuestoes() {
            const container = document.getElementById('questions-list');
            let html = '';

            questoes.forEach((q, index) => {
                html += `
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="font-semibold text-slate-800 mb-3">${q.pergunta}</p>
                        <div class="space-y-2">
                `;

                q.opcoes.forEach((opcao, optIndex) => {
                    const letra = String.fromCharCode(65 + optIndex); // A, B, C, D
                    html += `
                        <label class="flex items-start gap-3 p-2.5 rounded-lg hover:bg-orange-50 cursor-pointer transition border border-transparent hover:border-orange-200">
                            <input type="radio" name="q${index}" value="${optIndex}" class="mt-1 text-orange-600 focus:ring-orange-500">
                            <span class="text-sm text-slate-700"><strong>${letra})</strong> ${opcao}</span>
                        </label>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Function to calculate score and switch screens
        function calcularNota() {
            let acertos = 0;
            let respondidas = 0;

            questoes.forEach((q, index) => {
                const selecionada = document.querySelector(`input[name="q${index}"]:checked`);
                if (selecionada) {
                    respondidas++;
                    if (parseInt(selecionada.value) === q.resposta) {
                        acertos++;
                    }
                }
            });

            if (respondidas < questoes.length) {
                // Custom non-intrusive notification message instead of alert()
                alert(`Você respondeu ${respondidas} de ${questoes.length} questões. Por favor, responda todas antes de enviar!`);
                return;
            }

            // Calculate grade out of 10 or show out of 20
            const notaDez = ((acertos / 20) * 10).toFixed(1);

            // Hide quiz container and show result container
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            document.getElementById('score-display').innerText = `${acertos} / 20 (${notaDez})`;

            let mensagem = "";
            if (acertos === 20) {
                mensagem = "Perfeito! Nota máxima! Você dominou completamente a matéria!";
            } else if (acertos >= 15) {
                mensagem = "Excelente trabalho! Ótimo domínio dos conteúdos de geografia.";
            } else if (acertos >= 10) {
                mensagem = "Bom esforço! Vale a pena dar uma revisada rápida nos tópicos que erraste.";
            } else {
                mensagem = "Continue estudando e tente novamente! A prática leva à perfeição.";
            }
            document.getElementById('feedback-message').innerText = mensagem;

            // Scroll to top of results
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Function to restart quiz
        function reiniciarQuiz() {
            document.getElementById('quiz-form').reset();
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize on load
        window.onload = function() {
            renderizarQuestoes();
        };
    </script>
